<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>504 · 서버를 준비하는 중입니다</title>
<link rel="icon" href="/favicon.png">
<!-- 서버(nginx)가 직접 보여주는 오류 페이지: 앱 화면의 공통 오류 페이지(ErrorPage)와 같은 모양 -->
<style>
  :root { --bg: #fff; --text: #000; --dimmed: #868e96; --border: #ced4da; --hover: #f8f9fa; }
  @media (prefers-color-scheme: dark) { :root { --bg: #242424; --text: #c9c9c9; --dimmed: #828282; --border: #424242; --hover: #3b3b3b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
  .code { font-size: 96px; font-weight: 700; line-height: 1; color: var(--dimmed); }
  h1 { margin: 26px 0 0; font-size: 22px; font-weight: 700; }
  a { display: inline-block; margin-top: 30px; padding: 0 18px; height: 36px; line-height: 34px; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600; }
  a:hover { background: var(--hover); }
</style>
</head>
<body>
<main>
  <div class="code">504</div>
  <h1>서버를 준비하는 중입니다</h1>
  <a href="" onclick="location.reload(); return false;">다시 시도</a>
</main>
</body>
</html>
