spring:
  application:
    name: portal
  config:
    import:
      - optional:file:./.env-develop[.properties]
      - optional:file:../.env-develop[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${DB_USERNAME:portal}
    password: ${DB_PASSWORD:portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_SIZE:50MB}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-client-secret}
            scope: openid,email,profile
  session:
    jdbc:
      initialize-schema: never

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 14d
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  auth:
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:example.com,example.org}
    allowed-hosted-domains: ${ALLOWED_HOSTED_DOMAINS:example.org,example.com}
  storage:
    path: ${STORAGE_PATH:./storage}
  internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
  holiday:
    api-key: ${HOLIDAY_API_KEY:}
  # CS 시스템(cs-board) 연동. api-url·api-key가 비면 메인 신규 CS 칸에 미설정 안내
  cs:
    api-url: ${CS_API_URL:}
    api-key: ${CS_API_KEY:}
    web-url: ${CS_WEB_URL:}
  # 메인 모니터링 칸의 서버 자원. disks는 "이름=경로,이름=경로" (비면 루트 하나)
  monitor:
    proc-path: ${MONITOR_PROC_PATH:/proc}
    server-name: ${MONITOR_SERVER_NAME:포털 서버}
    disks: ${MONITOR_DISKS:}
    # 서버 운영체제 이름을 읽을 os-release 파일 (compose에서 서버 파일을 읽기 전용으로 연결)
    os-release-path: ${MONITOR_OS_RELEASE_PATH:/host/os-release}
    # 모니터링 상세 화면에서 확인할 대상: "구분|이름|대상"을 ; 으로 나열 (구분 app·db, 대상 https://주소 또는 host:port)
    targets: ${MONITOR_TARGETS:}
    # 다른 운영 서버 자원: "이름=http://주소:9100/metrics"를 ; 으로 나열 (각 서버 node_exporter, 비면 포털 서버만)
    remote-servers: ${MONITOR_REMOTE_SERVERS:}
