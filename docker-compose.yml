name: team_portal

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # 로그 시각을 KST로 (log_timezone은 DB 생성 시점 값이 설정 파일에 남아 있어 실행 옵션으로 덮어씀)
    command: ["postgres", "-c", "log_timezone=Asia/Seoul"]
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: portal
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 로그 시각을 KST로 (저장 시각은 Instant·TIMESTAMPTZ라 영향 없음)
      TZ: Asia/Seoul
      DB_URL: jdbc:postgresql://postgres:5432/portal
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE: 50MB
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN을 .env에 설정하세요}
      HOLIDAY_API_KEY: ${HOLIDAY_API_KEY:-}
      CS_API_URL: ${CS_API_URL:-}
      CS_API_KEY: ${CS_API_KEY:-}
      CS_WEB_URL: ${CS_WEB_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID를 .env에 설정하세요}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET을 .env에 설정하세요}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-example.com,example.org}
      ALLOWED_HOSTED_DOMAINS: ${ALLOWED_HOSTED_DOMAINS:-example.org,example.com}
      SESSION_COOKIE_SECURE: "true"
      # 메인 모니터링 칸: 컨테이너 루트(/)는 Docker 데이터가 있는 디스크, 시스템 디스크는 아래 빈 폴더로 읽음
      MONITOR_SERVER_NAME: ${MONITOR_SERVER_NAME:-포털 서버}
      MONITOR_DISKS: ${MONITOR_DISKS:-시스템=/host/disks/system,데이터=/}
    volumes:
      - storage:/app/storage
      # 시스템 디스크 사용량만 보려고 연결하는 빈 폴더 (읽기 전용, 없으면 Docker가 만듦)
      - /opt/team-portal/disk-probe:/host/disks/system:ro

  collab:
    build: ./collab
    restart: unless-stopped
    # 종료 시 저장 재시도(최대 30초)를 기다림
    stop_grace_period: 40s
    depends_on:
      - backend
    environment:
      TZ: Asia/Seoul
      COLLAB_PORT: 1234
      BACKEND_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
      - collab
    environment:
      TZ: Asia/Seoul
    ports:
      - "${PORTAL_PORT:-80}:80"

volumes:
  pgdata:
  storage:
